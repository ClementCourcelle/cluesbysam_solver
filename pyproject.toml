[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cluesbysam_solver"
version = "0.1.1"
description = "Solve the current day's puzzle of Clues by Sam: cluesbysam.com"
requires-python = ">=3.9"
dependencies = [
    # tes dépendances ici, ex: "requests>=2.28.0"
    "z3-solver",
    "playwright",
    "pydantic"
]

[tool.setuptools.packages.find]
where = ["src"]
